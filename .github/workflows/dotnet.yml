name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDayAPI.Tests/RaceDayAPI.Tests.csproj

    - name: Build
      run: dotnet build RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --no-restore

    - name: Test
      run: dotnet test RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --no-build --verbosity normal
      env:
        ASPNETCORE_ENVIRONMENT: Testing
